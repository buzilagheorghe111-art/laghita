<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#17181d"><title>Administrare – Service Auto La Ghiță</title><link rel="stylesheet" href="site-features.css"><style>
*{box-sizing:border-box}body{margin:0;background:#17181d;color:#eceef2;font:15px 'DM Sans',Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:24px}.brand{font-size:22px;font-weight:800;color:white}.brand span{color:#ff3150}.panel{background:#24262d;border:1px solid #41444e;border-radius:16px;padding:22px;margin:16px 0}.login{max-width:440px;margin:8vh auto}.field{display:grid;gap:7px;margin:14px 0}.field input{width:100%;padding:13px;border:1px solid #555965;border-radius:8px;background:#191b21;color:white;font:inherit}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer;background:#e6002e;color:white}.btn:disabled{opacity:.55;cursor:wait}.btn.secondary{background:#383b45}.btn.green{background:#16834d}.btn.amber{background:#9a6812}.btn.gray{background:#555965}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#30323a;padding:17px;border-radius:12px}.stat b{display:block;font-size:28px}.stat small{color:#b9bec8}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.filters .btn.active{outline:2px solid white;outline-offset:2px}.list{display:grid;gap:12px}.booking{background:#30323a;border:1px solid #484b55;border-radius:12px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:14px}.booking h3{margin:0 0 7px}.muted{color:#b9bec8;font-size:13px;line-height:1.6}.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center;justify-content:flex-end}.status{display:inline-block;padding:5px 9px;border-radius:99px;background:#484b55;font-size:12px;font-weight:800}.empty{text-align:center;color:#b9bec8;padding:30px}.error{color:#ff8795}.success{color:#6ce0a2}@media(max-width:700px){.wrap{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.booking{grid-template-columns:1fr}.actions{justify-content:flex-start}.panel{padding:16px}}
</style></head><body><main class="wrap">
<header class="top"><div class="brand">LA GHIȚĂ <span>· ADMIN</span></div><button id="logout" class="btn secondary" hidden>Deconectare</button></header>
<section id="login-panel" class="panel login"><h1>Panou de administrare</h1><p class="muted">Autentificare pentru administratorul Service Auto „La Ghiță”.</p><form id="login-form"><label class="field">E-mail<input name="email" type="email" autocomplete="username" value="buzilagheorghe111@gmail.com" required></label><label class="field">Parolă<input name="password" type="password" autocomplete="current-password" required></label><button class="btn" type="submit">Intră în panou</button></form><p id="login-message" class="muted" role="status"></p><button id="reset-password" class="btn secondary">Am uitat parola</button></section>
<section id="dashboard" hidden><div class="panel"><div class="top"><div><h1>Programări și lucrări</h1><p class="muted">Gestionează solicitările primite prin site.</p></div><button id="refresh" class="btn secondary">↻ Actualizează</button></div><div class="stats"><div class="stat"><b id="count-new">0</b><small>Solicitări noi</small></div><div class="stat"><b id="count-confirmed">0</b><small>Confirmate</small></div><div class="stat"><b id="count-progress">0</b><small>În lucru</small></div><div class="stat"><b id="count-completed">0</b><small>Finalizate</small></div></div></div>
<div class="panel"><div class="top"><h2>Lista programărilor</h2><span id="last-update" class="muted"></span></div><div class="filters" id="filters"><button class="btn secondary active" data-filter="all">Toate</button><button class="btn secondary" data-filter="new">Noi</button><button class="btn secondary" data-filter="confirmed">Confirmate</button><button class="btn secondary" data-filter="in_progress">În lucru</button><button class="btn secondary" data-filter="waiting_parts">Așteaptă piese</button><button class="btn secondary" data-filter="completed">Finalizate</button><button class="btn secondary" data-filter="cancelled">Anulate</button></div><div id="booking-list" class="list"><p class="empty">Se încarcă...</p></div><p id="dashboard-message" class="muted" role="status"></p></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin-dashboard.js"></script></body></html>
